{% extends "layout.html" %}

{% block title %}Asignar Agente{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-person-plus-fill" style="color: #818cf8;"></i> Asignar Agente a Propiedad</h1>
        <p class="subtitle">{{ p.direccion }} (#{{ p.id }})</p>
    </div>
    <a href="{{ url_for('views.propiedad_detalle', id_propiedad=p.id) }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver al Detalle
    </a>
</div>

<div class="card" style="max-width: 620px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.45rem;">
        <i class="bi bi-sliders" style="color: #818cf8;"></i> Parámetros de Comercialización
    </h2>
    
    <form action="{{ url_for('views.propiedad_asignar', id_propiedad=p.id) }}" method="POST" onsubmit="return confirm('¿Confirmar la asignación del agente comercial seleccionado a esta propiedad?');">
        <div class="form-grid" style="grid-template-columns: 1fr;">
            <div class="form-group">
                <label for="id_agente"><i class="bi bi-person-fill"></i> Seleccionar Agente Comercial</label>
                <select id="id_agente" name="id_agente" required>
                    <option value="" disabled selected>Selecciona el agente comercial...</option>
                    {% for a in agentes %}
                        <option value="{{ a.id }}">{{ a.nombre_completo }} (Matrícula: {{ a.matricula }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="desde"><i class="bi bi-calendar-check"></i> Fecha y Hora de Inicio</label>
                <input type="datetime-local" id="desde" name="desde" required>
            </div>
            
            <div class="form-group">
                <label for="hasta"><i class="bi bi-calendar-x"></i> Fecha y Hora de Fin (Opcional)</label>
                <input type="datetime-local" id="hasta" name="hasta">
                <small style="color: var(--text-muted);">Dejar en blanco para asignación indefinida / permanente.</small>
            </div>
        </div>
        
        <div style="display: flex; gap: 0.8rem; margin-top: 1.8rem; justify-content: flex-end;">
            <a href="{{ url_for('views.propiedad_detalle', id_propiedad=p.id) }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check2-circle"></i> Confirmar Asignación
            </button>
        </div>
    </form>
</div>

<script>
    // Autofill start date with today
    document.addEventListener("DOMContentLoaded", function() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        document.getElementById('desde').value = `${year}-${month}-${day}T${hours}:${minutes}`;
    });
</script>
{% endblock %}
