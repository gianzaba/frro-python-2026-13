<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada - InmoGestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 1.5rem;
        }
        .error-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-lg);
            padding: 3rem 2.5rem;
            max-width: 480px;
            box-shadow: var(--box-shadow);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #ffffff;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title"><i class="bi bi-compass" style="color: #818cf8;"></i> Página No Encontrada</h1>
        <p class="error-desc">El recurso o sección que estás intentando consultar no existe o fue reubicada en el sistema.</p>
        <a href="{{ url_for('views.dashboard') }}" class="btn btn-primary" style="display: inline-flex;">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</body>
</html>
