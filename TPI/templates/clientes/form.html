{% extends "layout.html" %}

{% block title %}Nuevo Cliente{% endblock %}

{% block content %}
<header>
    <div>
        <h1>Registrar Cliente</h1>
        <p style="color: var(--text-secondary); margin-top: 0.2rem;">Agrega un nuevo cliente interesado en transacciones inmobiliarias</p>
    </div>
    <a href="{{ url_for('views.clientes_list') }}" class="btn btn-secondary">🠰 Volver al Listado</a>
</header>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2>Datos Personales del Cliente</h2>
    
    <form action="{{ url_for('views.cliente_crear') }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="tipo_doc">Tipo de Documento</label>
                <select id="tipo_doc" name="tipo_doc" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="DNI">DNI</option>
                    <option value="Pasaporte">Pasaporte</option>
                    <option value="CUIL">CUIL</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="nro_doc">Número de Documento</label>
                <input type="text" id="nro_doc" name="nro_doc" placeholder="Ej: 12345678" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ej: juan.perez@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono de Contacto</label>
                <input type="text" id="telefono" name="telefono" placeholder="Ej: 3415551234" required>
            </div>
            
            <div class="form-group form-group-full">
                <label for="domicilio">Domicilio</label>
                <input type="text" id="domicilio" name="domicilio" placeholder="Ej: Santa Fe 1200, Piso 3" required>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem; justify-content: flex-end;">
            <a href="{{ url_for('views.clientes_list') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Registrar Cliente</button>
        </div>
    </form>
</div>
{% endblock %}
