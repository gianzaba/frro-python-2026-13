{% extends "layout.html" %}

{% block title %}Nuevo Cliente{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-person-plus-fill" style="color: #818cf8;"></i> Registrar Cliente</h1>
        <p class="subtitle">Agrega un nuevo cliente interesado en transacciones inmobiliarias</p>
    </div>
    <a href="{{ url_for('views.clientes_list') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver al Listado
    </a>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.45rem;">
        <i class="bi bi-person-vcard" style="color: #818cf8;"></i> Datos Personales del Cliente
    </h2>
    
    <form action="{{ url_for('views.cliente_crear') }}" method="POST" onsubmit="return confirm('¿Confirmar el registro del nuevo cliente?');">
        <div class="form-grid">
            <div class="form-group">
                <label for="nombre"><i class="bi bi-person"></i> Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
            </div>
            
            <div class="form-group">
                <label for="apellido"><i class="bi bi-person"></i> Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="tipo_doc"><i class="bi bi-card-heading"></i> Tipo de Documento</label>
                <select id="tipo_doc" name="tipo_doc" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="DNI">DNI</option>
                    <option value="Pasaporte">Pasaporte</option>
                    <option value="CUIL">CUIL</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="nro_doc"><i class="bi bi-hash"></i> Número de Documento</label>
                <input type="text" id="nro_doc" name="nro_doc" placeholder="Ej: 12345678" required>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="bi bi-envelope"></i> Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ej: juan.perez@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="telefono"><i class="bi bi-telephone"></i> Teléfono de Contacto</label>
                <input type="text" id="telefono" name="telefono" placeholder="Ej: 3415551234" required>
            </div>
            
            <div class="form-group form-group-full">
                <label for="domicilio"><i class="bi bi-geo-alt"></i> Domicilio Real</label>
                <input type="text" id="domicilio" name="domicilio" placeholder="Ej: Santa Fe 1200, Piso 3" required>
            </div>
        </div>
        
        <div style="display: flex; gap: 0.8rem; margin-top: 1.8rem; justify-content: flex-end;">
            <a href="{{ url_for('views.clientes_list') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle-fill"></i> Registrar Cliente
            </button>
        </div>
    </form>
</div>
{% endblock %}
