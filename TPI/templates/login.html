<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - InmoGestión B2B</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2.0">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            min-height: 100vh;
            padding: 1.5rem;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 10%, rgba(79, 70, 229, 0.05) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(99, 102, 241, 0.05) 0px, transparent 40%);
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2.8rem 2.4rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }

        .login-brand {
            text-align: center;
            font-size: 1.95rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-brand i {
            color: #4f46e5;
        }

        .login-desc {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-brand .brand-badge {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.2rem 0.45rem;
            border-radius: 4px;
            background: #eef2ff;
            color: #4f46e5;
            border: 1px solid #c7d2fe;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <i class="bi bi-buildings-fill"></i> InmoGestión <span class="brand-badge">B2B</span>
        </div>
        <div class="login-desc">Plataforma Backoffice para Gestión Inmobiliaria</div>

        <!-- Flashes -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="bi {% if category == 'success' %}bi-check-circle-fill{% elif category == 'danger' %}bi-exclamation-triangle-fill{% elif category == 'warning' %}bi-exclamation-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('views.login') }}" method="POST">
            <div class="form-grid" style="grid-template-columns: 1fr; gap: 1.2rem; margin-bottom: 1.8rem;">
                <div class="form-group">
                    <label for="email"><i class="bi bi-envelope"></i> Correo Corporativo</label>
                    <input type="email" id="email" name="email" placeholder="agente@inmogestion.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password"><i class="bi bi-shield-lock"></i> Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión en Backoffice
            </button>
        </form>
    </div>
</body>
</html>
