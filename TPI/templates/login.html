<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - InmoGestión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }
        .login-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .login-logo {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }
        .alert {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            padding: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">✦ InmoGestión</div>
        <div class="login-desc">Plataforma digital para la gestión inmobiliaria</div>
        
        <!-- Flashes -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('views.login') }}" method="POST">
            <div class="form-grid" style="grid-template-columns: 1fr; gap: 1.2rem; margin-bottom: 2rem;">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="agente@inmogestion.com" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
